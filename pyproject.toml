[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-segmentation-research"
version = "1.0.0"
description = "Research-only MRI slice tumor segmentation with U-Net, DeepLabV3+ and ResNet50 U-Net"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2.2",
  "opencv-python-headless>=4.8,<5",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
train = ["tensorflow>=2.16,<2.21", "matplotlib>=3.7,<4"]
demo = ["tensorflow>=2.16,<2.21", "gradio>=5,<7"]
notebook = ["jupyterlab>=4,<5"]
dev = ["pytest>=8,<10", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
